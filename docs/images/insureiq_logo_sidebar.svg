<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60" fill="none">
  <defs>
    <linearGradient id="sbShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17365D" />
      <stop offset="100%" stop-color="#0F243E" />
    </linearGradient>
    <linearGradient id="sbBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F9D92" />
      <stop offset="60%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="sbCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- Shield Icon (Left) -->
  <g transform="translate(2, 2)">
    <path d="M28 4 C42 4 50 10 50 26 C50 41 38 50 28 56 C18 50 6 41 6 26 C6 10 14 4 28 4 Z" 
          fill="url(#sbShieldBg)" stroke="url(#sbBorderGrad)" stroke-width="2" stroke-linejoin="round"/>
    <!-- Cross -->
    <rect x="24" y="17" width="8" height="22" rx="4" fill="url(#sbCrossGrad)"/>
    <rect x="17" y="24" width="22" height="8" rx="4" fill="url(#sbCrossGrad)"/>
    <!-- Central AI Node -->
    <circle cx="28" cy="28" r="4.2" fill="#0F9D92"/>
    <circle cx="28" cy="28" r="2" fill="#FFFFFF"/>
    <!-- Spark dot -->
    <circle cx="39" cy="19" r="1.5" fill="#2563EB"/>
  </g>

  <!-- Wordmark Text (Right) -->
  <text x="64" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" fill="#17365D" letter-spacing="-0.03em">Insure<tspan fill="#0F9D92" font-weight="800">IQ</tspan></text>
  <text x="64" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.2" font-weight="700" fill="#526B85" letter-spacing="0.08em">HEALTH COVERAGE INTELLIGENCE</text>
</svg>